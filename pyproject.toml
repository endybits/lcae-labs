[project]
name = "lcae-labs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Endybits", email = "endyb.dev@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.6",
    "langchain-google-genai>=4.4.2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
lcae-labs = "lcae_labs:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
